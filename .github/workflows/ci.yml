name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-tarball
          path: oodle-ai-mobile-sdk-reactnative-*.tgz

  # The Fieldwork fixture (fixtures/fieldwork) is built as a new app with
  # this SDK and the Datadog React Native SDK, on the oldest supported
  # React Native version and on the newest. It is then started on an
  # emulator or simulator against the mock collector, and the data that
  # arrives is checked (scripts/ci/check-collector.mjs).
  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        react-native: ['0.79.7', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-tarball
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: scripts/ci/create-fixture.sh "${{ matrix.react-native }}" oodle-ai-mobile-sdk-reactnative-*.tgz both
      - name: Build release APK
        working-directory: ${{ env.FIXTURE_DIR }}/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      # The release build fills most of the runner disk, and the emulator
      # needs room for its data partition.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          rm -rf "$FIXTURE_DIR/android/app/build/intermediates" "$FIXTURE_DIR/android/build" ~/.gradle/caches/build-cache-*
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the mock collector
        run: |
          mkdir -p "$RUNNER_TEMP/collector"
          nohup node scripts/mock-collector.mjs --api-port 4319 --out "$RUNNER_TEMP/collector" > "$RUNNER_TEMP/collector/collector.log" 2>&1 &
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # API 31: the oldest level with the system exit record and a fast,
          # reliable boot on hosted runners.
          api-level: 31
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/android-smoke.sh "${{ env.FIXTURE_DIR }}/android/app/build/outputs/apk/release/app-release.apk" "${{ runner.temp }}/collector"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ matrix.react-native }}-collector
          path: ${{ runner.temp }}/collector

  ios:
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        react-native: ['0.79.7', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-tarball
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: scripts/ci/create-fixture.sh "${{ matrix.react-native }}" oodle-ai-mobile-sdk-reactnative-*.tgz both
      - name: Install pods
        working-directory: ${{ env.FIXTURE_DIR }}/ios
        run: |
          bundle install
          bundle exec pod install
      - name: Build for the simulator
        working-directory: ${{ env.FIXTURE_DIR }}/ios
        run: |
          if ! xcodebuild -workspace OodleExample.xcworkspace -scheme OodleExample \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
            grep -E "error:|The following build commands failed" -A4 "$RUNNER_TEMP/xcodebuild.log" | head -150
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/xcodebuild.log"
      - name: Start the mock collector
        run: |
          mkdir -p "$RUNNER_TEMP/collector"
          nohup node scripts/mock-collector.mjs --api-port 4319 --out "$RUNNER_TEMP/collector" > "$RUNNER_TEMP/collector/collector.log" 2>&1 &
      - name: Run on the simulator
        run: bash scripts/ci/ios-smoke.sh "$FIXTURE_DIR/ios/build/Build/Products/Release-iphonesimulator/OodleExample.app" "$RUNNER_TEMP/collector"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-${{ matrix.react-native }}-collector
          path: ${{ runner.temp }}/collector
