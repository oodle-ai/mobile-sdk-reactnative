name: Compare with the reference SDK

# Runs the Fieldwork fixture with the Oodle SDK and the reference SDK on an
# emulator and a simulator, with and without session replay
# (scripts/compare/run.sh):
#   parity  both SDKs on the same launches; where their data differs,
#           one of them is wrong. A difference fails the job, unless
#           scripts/compare/parity-allowlist.json explains it.
#   cost    no SDK, Oodle and the reference SDK in turn on the same walks: CPU,
#           memory, start time, frames, bytes and requests of each.
# Each job writes its reports to the job summary and keeps the collector
# data as an artifact. It takes longer than CI, so it runs each day and
# on request, not on each pull request.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      parity_launches:
        description: Launches with both SDKs, for parity
        default: '20'
      cost_rounds:
        description: Rounds of no SDK, Oodle and the reference SDK, for cost (a multiple of 3, so each SDK runs first as often)
        default: '6'
      cost_launches:
        description: Launches for each SDK in a round
        default: '5'

permissions:
  contents: read

concurrency:
  group: compare-${{ github.ref }}
  cancel-in-progress: true

env:
  PARITY_LAUNCHES: ${{ inputs.parity_launches || '20' }}
  ROUNDS: ${{ inputs.cost_rounds || '6' }}
  LAUNCHES: ${{ inputs.cost_launches || '5' }}

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-tarball
          path: oodle-ai-mobile-sdk-reactnative-*.tgz

  android:
    needs: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        replay: ['on', 'off']
    env:
      REPLAY: ${{ matrix.replay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-tarball
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: scripts/ci/create-fixture.sh latest oodle-ai-mobile-sdk-reactnative-*.tgz both
      - name: Build release APK
        working-directory: ${{ env.FIXTURE_DIR }}/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      # As in ci.yml: the build fills most of the disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          rm -rf "$FIXTURE_DIR/android/app/build/intermediates" "$FIXTURE_DIR/android/build" ~/.gradle/caches/build-cache-*
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/compare/run.sh android "${{ env.FIXTURE_DIR }}/android/app/build/outputs/apk/release/app-release.apk" "${{ runner.temp }}/compare"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-android-replay-${{ matrix.replay }}
          path: ${{ runner.temp }}/compare

  ios:
    needs: sdk
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        replay: ['on', 'off']
    env:
      REPLAY: ${{ matrix.replay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-tarball
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: scripts/ci/create-fixture.sh latest oodle-ai-mobile-sdk-reactnative-*.tgz both
      - name: Install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: command -v ccache || brew install ccache
      - name: Install pods
        working-directory: ${{ env.FIXTURE_DIR }}/ios
        run: |
          bundle install
          bundle exec pod install
      # Uses the compiled objects that ci.yml saves. This workflow does not
      # save its own.
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-v2-ios-latest-none
          restore-keys: ccache-v2-ios-latest-
      - name: Configure ccache
        run: |
          ccache --set-config max_size=3G
          ccache --set-config sloppiness=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          ccache --set-config file_clone=true
          ccache --set-config depend_mode=true
          ccache --set-config inode_cache=true
      - name: Build for the simulator
        working-directory: ${{ env.FIXTURE_DIR }}/ios
        run: |
          mkdir -p "$RUNNER_TEMP/compare"
          LOG="$RUNNER_TEMP/compare/xcodebuild.log"
          if ! xcodebuild -workspace OodleExample.xcworkspace -scheme OodleExample \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            C_COMPILER_LAUNCHER="$(command -v ccache)" CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO build > "$LOG" 2>&1; then
            grep -E "error:|The following build commands failed" -A4 "$LOG" | head -150
            exit 1
          fi
          tail -5 "$LOG"
      - name: Boot a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j |
            python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          echo "SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
      # Real taps in the simulator (tap_label in scripts/ci/device.sh):
      # simctl has no tap. parity.mjs fails when a tap was not made.
      - name: Install AXe
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cameroncooke/axe/axe
          command -v axe
      - name: Compare on the simulator
        run: bash scripts/compare/run.sh ios "$FIXTURE_DIR/ios/build/Build/Products/Release-iphonesimulator/OodleExample.app" "$RUNNER_TEMP/compare"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-ios-replay-${{ matrix.replay }}
          path: ${{ runner.temp }}/compare
